name: Public examples
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run demo
      - run: npm test
  swift-contract:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run fixtures
      - run: swift --version
      - run: swift test --package-path companion/ReadAlongKit
        env:
          READALONG_CONTRACT_FIXTURES: ${{ github.workspace }}/.tmp/contract-fixtures
